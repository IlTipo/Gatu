<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Installabile come app: "Aggiungi a schermata Home" (%BASE_URL% viene sostituito da scripts/build-web.mjs) -->
    <link rel="manifest" href="%BASE_URL%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Morso" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#FBF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16110D" media="(prefers-color-scheme: dark)" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #fbf7f2;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #16110d;
        }
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Per usare Morso devi attivare JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
