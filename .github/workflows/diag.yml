# Controllo temporaneo: legge gli ultimi errori delle funzioni del server (solo messaggi di errore, nessun dato utente).
name: Diagnostica funzioni
on:
  push:
    branches: [claude/morso-food-app-3op2rx]
    paths: ['.github/workflows/diag.yml']
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Ultimi errori di "extract"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF=ttwjohlyioluvcqywadi
          START=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          q() {
          curl -sS -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --data-urlencode "sql=$1" --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END" \
            | python3 -c "import json,sys; raw=sys.stdin.read(); print(raw[:300]); d=json.loads(raw); [print(r.get('timestamp'), str(r.get('event_message'))[:400]) for r in d.get('result') or []]"
          }
          echo "== messaggi delle funzioni =="
          q "select timestamp, event_message from function_logs where event_message not like '%booted%' and event_message not like '%shutdown%' order by timestamp desc limit 80"
          echo "== richieste a extract (stato) =="
          q "select timestamp, event_message from function_edge_logs order by timestamp desc limit 30"
