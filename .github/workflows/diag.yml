# Controllo temporaneo: prova con l'AI vera la lettura di una nota della spesa.
name: Diagnostica funzioni
on:
  push:
    branches: [claude/morso-food-app-3op2rx]
    paths: ['.github/workflows/diag.yml']
permissions:
  contents: read
jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lista della spesa da foto (AI vera)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: deno run --config supabase/functions/deno.json --allow-env --allow-net --allow-read supabase/functions/tests-live/shopping.live.ts
