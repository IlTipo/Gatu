# Pubblica il sito di Morso su GitHub Pages a ogni push.
# Il sito costruito viene salvato nel branch "gh-pages" (lo crea questo workflow).
# Impostazioni da fare una volta sola: vedi README → "Mettere il sito online".
name: Pubblica il sito

on:
  push:
    branches: [main, claude/morso-food-app-3op2rx]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Controlli (tipi, stile, test, sicurezza database, funzioni del server)
        run: |
          npm run typecheck
          npm run lint
          npm test -- --ci
          npm run test:db
          npm run lint:functions
          npm run test:functions

      # Pubblica le Edge Functions su Supabase (solo se è stato impostato il secret SUPABASE_ACCESS_TOKEN)
      - name: Pubblica le funzioni del server su Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          # https://abcdefgh.supabase.co  →  abcdefgh
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          npx --yes supabase@2.121.0 functions deploy extract --project-ref "$PROJECT_REF" --use-api --no-verify-jwt

      - name: Costruisci il sito
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          # Chiavi PUBBLICHE di Supabase, impostate in Settings → Secrets and variables → Actions → Variables
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: npm run build:web

      - name: Pubblica nel branch gh-pages
        working-directory: dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sito pubblicato da ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
