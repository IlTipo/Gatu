# Pubblica Morso a ogni push:
#  - prepara/aggiorna Supabase (progetto, tabelle, accesso, funzioni) se c'è il secret SUPABASE_ACCESS_TOKEN
#  - costruisce il sito e lo salva nel branch "gh-pages" (servito da GitHub Pages)
# Impostazioni da fare una volta sola: vedi README → "Mettere il sito online".
name: Pubblica il sito

on:
  push:
    branches: [main, claude/morso-food-app-3op2rx]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: false # non interrompere a metà la preparazione di Supabase

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # il permesso di scrittura non resta su disco mentre girano dipendenze e test
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Controlli (tipi, stile, test, sicurezza database, funzioni del server)
        run: |
          npm run typecheck
          npm run lint
          npm test -- --ci
          npm run test:db
          npm run lint:functions
          npm run test:functions

      # Cloudflare Pages (facoltativo): con la variabile CLOUDFLARE_PROJECT (es. "morso") e i secret
      # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID il sito va su https://morso.pages.dev
      - name: Cloudflare Pages (progetto e indirizzo)
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
        if: vars.CLOUDFLARE_PROJECT != ''
        run: node scripts/cloudflare-pages.mjs

      # Indirizzo del sito: https://<utente>.github.io/<repo>/ oppure, se c'è la variabile
      # CUSTOM_DOMAIN (es. morso.app), https://morso.app/ alla radice del dominio.
      - name: Indirizzo del sito
        id: site
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          CF_URL: ${{ steps.cloudflare.outputs.url }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$CF_URL" ]; then
            { echo "hosting=cloudflare"; echo "domain="; echo "base="; echo "url=$CF_URL"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "hosting=github" >> "$GITHUB_OUTPUT"
          DOMAIN=$(echo "$CUSTOM_DOMAIN" | tr '[:upper:]' '[:lower:]' | sed -e 's#^https\?://##' -e 's#/.*$##')
          if [ -n "$DOMAIN" ]; then
            if ! echo "$DOMAIN" | grep -Eq '^[a-z0-9.-]+\.[a-z]{2,}$'; then
              echo "::error::CUSTOM_DOMAIN non valido: $DOMAIN"; exit 1
            fi
            { echo "domain=$DOMAIN"; echo "base="; echo "url=https://$DOMAIN/"; } >> "$GITHUB_OUTPUT"
          else
            { echo "domain="; echo "base=/$REPO"; echo "url=https://$OWNER.github.io/$REPO/"; } >> "$GITHUB_OUTPUT"
          fi

      # Prepara Supabase in automatico (solo se è stato impostato il secret SUPABASE_ACCESS_TOKEN)
      - name: Prepara Supabase (progetto, tabelle, accesso)
        id: supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SITE_URL: ${{ steps.site.outputs.url }}
          # facoltativi: attivano "Accedi con Google"
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: node scripts/setup-supabase.mjs

      # Chiavi segrete delle funzioni (Gemini, e facoltativa Google Places): da GitHub Secrets a Supabase.
      # Non finiscono mai nel sito.
      - name: Imposta le chiavi segrete delle funzioni
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          # "Cosa aggiungeresti?" via email (facoltativo): chiave di resend.com e la TUA email
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FEEDBACK_EMAIL: ${{ secrets.FEEDBACK_EMAIL }}
          PROJECT_REF: ${{ steps.supabase.outputs.project_ref }}
        if: steps.supabase.outputs.project_ref != '' && (env.GEMINI_API_KEY != '' || env.GOOGLE_PLACES_API_KEY != '' || env.RESEND_API_KEY != '')
        run: |
          umask 077
          ENV_FILE=$(mktemp)
          [ -n "$GEMINI_API_KEY" ] && echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> "$ENV_FILE"
          [ -n "$GOOGLE_PLACES_API_KEY" ] && echo "GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY" >> "$ENV_FILE"
          [ -n "$RESEND_API_KEY" ] && echo "RESEND_API_KEY=$RESEND_API_KEY" >> "$ENV_FILE"
          [ -n "$FEEDBACK_EMAIL" ] && echo "FEEDBACK_EMAIL=$FEEDBACK_EMAIL" >> "$ENV_FILE"
          npx --yes supabase@2.121.0 secrets set --project-ref "$PROJECT_REF" --env-file "$ENV_FILE"
          rm -f "$ENV_FILE"

      - name: Pubblica le funzioni del server su Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.supabase.outputs.project_ref }}
        if: steps.supabase.outputs.project_ref != ''
        run: |
          npx --yes supabase@2.121.0 functions deploy extract --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          npx --yes supabase@2.121.0 functions deploy push --project-ref "$PROJECT_REF" --use-api --no-verify-jwt

      - name: Costruisci il sito
        env:
          EXPO_BASE_URL: ${{ steps.site.outputs.base }}
          CUSTOM_DOMAIN: ${{ steps.site.outputs.domain }}
          HOSTING: ${{ steps.site.outputs.hosting }}
          # Chiavi PUBBLICHE di Supabase: lette in automatico dal passo precedente
          # (oppure, in alternativa, dalle Variables SUPABASE_URL / SUPABASE_KEY del repository)
          EXPO_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.supabase_url || vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ steps.supabase.outputs.supabase_key || vars.SUPABASE_KEY }}
        run: npm run build:web

      - name: Pubblica su Cloudflare Pages
        if: steps.site.outputs.hosting == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ steps.cloudflare.outputs.project }}
        run: npx --yes wrangler@4.145.0 pages deploy dist --project-name "$CF_PROJECT" --branch main --commit-dirty=true

      # Versione nuova? Chi ha le notifiche "Novità di Morso" riceve l'avviso (dopo che il sito è online).
      - name: Annuncia la versione nuova
        if: steps.supabase.outputs.project_ref != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.supabase.outputs.project_ref }}
        run: node scripts/announce-release.mjs

      # Su GitHub Pages: il sito vero, oppure (se il sito è su Cloudflare) una pagina che rimanda lì.
      - name: Pubblica nel branch gh-pages
        env:
          HOSTING: ${{ steps.site.outputs.hosting }}
          SITE_URL: ${{ steps.site.outputs.url }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ "$HOSTING" = "cloudflare" ]; then
            node scripts/redirect-page.mjs "$SITE_URL" ghpages "/$REPO"
            cd ghpages
          else
            cd dist
          fi
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sito pubblicato da ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
