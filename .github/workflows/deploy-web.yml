# Pubblica Morso a ogni push:
#  - prepara/aggiorna Supabase (progetto, tabelle, accesso, funzioni) se c'è il secret SUPABASE_ACCESS_TOKEN
#  - costruisce il sito e lo salva nel branch "gh-pages" (servito da GitHub Pages)
# Impostazioni da fare una volta sola: vedi README → "Mettere il sito online".
name: Pubblica il sito

on:
  push:
    branches: [main, claude/morso-food-app-3op2rx]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: false # non interrompere a metà la preparazione di Supabase

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # il permesso di scrittura non resta su disco mentre girano dipendenze e test
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Controlli (tipi, stile, test, sicurezza database, funzioni del server)
        run: |
          npm run typecheck
          npm run lint
          npm test -- --ci
          npm run test:db
          npm run lint:functions
          npm run test:functions

      # Indirizzo del sito: https://<utente>.github.io/<repo>/ oppure, se c'è la variabile
      # CUSTOM_DOMAIN (es. morso.app), https://morso.app/ alla radice del dominio.
      - name: Indirizzo del sito
        id: site
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          DOMAIN=$(echo "$CUSTOM_DOMAIN" | tr '[:upper:]' '[:lower:]' | sed -e 's#^https\?://##' -e 's#/.*$##')
          if [ -n "$DOMAIN" ]; then
            if ! echo "$DOMAIN" | grep -Eq '^[a-z0-9.-]+\.[a-z]{2,}$'; then
              echo "::error::CUSTOM_DOMAIN non valido: $DOMAIN"; exit 1
            fi
            { echo "domain=$DOMAIN"; echo "base="; echo "url=https://$DOMAIN/"; } >> "$GITHUB_OUTPUT"
          else
            { echo "domain="; echo "base=/$REPO"; echo "url=https://$OWNER.github.io/$REPO/"; } >> "$GITHUB_OUTPUT"
          fi

      # Prepara Supabase in automatico (solo se è stato impostato il secret SUPABASE_ACCESS_TOKEN)
      - name: Prepara Supabase (progetto, tabelle, accesso)
        id: supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SITE_URL: ${{ steps.site.outputs.url }}
          # facoltativi: attivano "Accedi con Google"
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: node scripts/setup-supabase.mjs

      # Chiavi segrete delle funzioni (Gemini, e facoltativa Google Places): da GitHub Secrets a Supabase.
      # Non finiscono mai nel sito.
      - name: Imposta le chiavi segrete delle funzioni
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        if: steps.supabase.outputs.project_ref != '' && (env.GEMINI_API_KEY != '' || env.GOOGLE_PLACES_API_KEY != '')
        run: |
          umask 077
          ENV_FILE=$(mktemp)
          [ -n "$GEMINI_API_KEY" ] && echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> "$ENV_FILE"
          [ -n "$GOOGLE_PLACES_API_KEY" ] && echo "GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY" >> "$ENV_FILE"
          npx --yes supabase@2.121.0 secrets set --project-ref "${{ steps.supabase.outputs.project_ref }}" --env-file "$ENV_FILE"
          rm -f "$ENV_FILE"

      - name: Pubblica le funzioni del server su Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        if: steps.supabase.outputs.project_ref != ''
        run: npx --yes supabase@2.121.0 functions deploy extract --project-ref "${{ steps.supabase.outputs.project_ref }}" --use-api --no-verify-jwt

      - name: Costruisci il sito
        env:
          EXPO_BASE_URL: ${{ steps.site.outputs.base }}
          CUSTOM_DOMAIN: ${{ steps.site.outputs.domain }}
          # Chiavi PUBBLICHE di Supabase: lette in automatico dal passo precedente
          # (oppure, in alternativa, dalle Variables SUPABASE_URL / SUPABASE_KEY del repository)
          EXPO_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.supabase_url || vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ steps.supabase.outputs.supabase_key || vars.SUPABASE_KEY }}
        run: npm run build:web

      - name: Pubblica nel branch gh-pages
        working-directory: dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sito pubblicato da ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
