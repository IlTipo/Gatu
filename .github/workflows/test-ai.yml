# Prova l'AI vera (Gemini): estrazione da caption di esempio, valori nutrizionali e varianti.
# Si avvia solo a mano da Actions, per non consumare la quota gratuita del sito.
# Usa il secret GEMINI_API_KEY e qualche richiesta della quota gratuita.
name: Prova l'AI

on:
  # Solo a mano (Actions → Prova l'AI → Run workflow): ogni prova usa ~10 delle
  # richieste AI gratuite del giorno, che servono al sito.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Estrazione con Gemini su caption di esempio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run test:ai-live
